name: Terraform AKS CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

# Required for Azure OIDC Authentication
permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.8.0"
  WORKING_DIR: "parent_module"

  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  ########################################
  # CI PIPELINE
  ########################################

  terraform-ci:
    name: Terraform Validate Scan Plan
    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Azure OIDC Login
      - name: Azure Login Using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform Format
      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      # Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init

      # Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform validate

      # TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform Lint
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tflint --init
          tflint

      # Checkov
      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true

      # Terraform Plan
      - name: Terraform Plan
        if: inputs.action != 'destroy'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan

      # Terraform Destroy Plan
      - name: Terraform Destroy Plan
        if: inputs.action == 'destroy'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -destroy


  ########################################
  # CD PIPELINE
  ########################################

  terraform-deploy:
    name: Terraform Azure Deployment

    needs: terraform-ci

    # Deploy conditions:
    #
    # 1. Push to main       -> APPLY
    # 2. Manual APPLY       -> APPLY
    # 3. Manual DESTROY     -> DESTROY
    #
    # Pull Request          -> NO DEPLOYMENT

    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.action == 'apply' ||
          inputs.action == 'destroy'
        )
      )

    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Azure OIDC Login
      - name: Azure Login Using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init

      ########################################
      # APPLY
      ########################################

      - name: Terraform Apply
        if: |
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.action == 'apply'
          )
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform apply -auto-approve

      ########################################
      # DESTROY
      ########################################

      - name: Terraform Destroy
        if: |
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'destroy'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform destroy -auto-approve
