name: Terraform AKS CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Required for Azure OIDC Authentication
permissions:
  id-token: write
  contents: read


env:
  TF_VERSION: "1.8.0"
  WORKING_DIR: "parent_module"

  # Terraform Azure OIDC Authentication
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


jobs:

  terraform-ci:

    name: Terraform CI Security Pipeline

    runs-on: ubuntu-latest


    steps:

    # Checkout Source Code

    - name: Checkout Repository
      uses: actions/checkout@v4


    # Azure Login Passwordless OIDC

    - name: Azure Login Using OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


    # Setup Terraform

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}


    # Terraform Formatting

    - name: Terraform Format Check
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        terraform fmt -check -recursive


    # Terraform Init

    - name: Terraform Init
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        terraform init


    # Terraform Validate

    - name: Terraform Validate
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        terraform validate


    # Install TFLint

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4


    # Terraform Code Linting

    - name: Run TFLint
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        tflint --init
        tflint


    # Terraform Security Scan

    - name: Checkov Security Scan
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: terraform
        soft_fail: true


    # Terraform Plan

    - name: Terraform Plan
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        terraform plan